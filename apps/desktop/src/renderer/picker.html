<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Share your screen</title>
    <link rel="stylesheet" href="picker.css" />
    <script src="picker.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="title">Share your screen</h1>
      <p id="lead" class="lead"></p>
      <section aria-labelledby="screens-title">
        <h2 id="screens-title">Screens</h2>
        <div id="screens" class="grid" role="radiogroup" aria-labelledby="screens-title"></div>
      </section>
      <section aria-labelledby="windows-title">
        <h2 id="windows-title">Windows</h2>
        <div id="windows" class="grid" role="radiogroup" aria-labelledby="windows-title"></div>
      </section>
    </main>
    <footer>
      <button type="button" id="cancel" class="secondary">Cancel</button>
      <button type="button" id="share" disabled>Share</button>
    </footer>
  </body>
</html>
