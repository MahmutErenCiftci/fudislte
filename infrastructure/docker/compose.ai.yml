# Optional AI worker (ADR-0012, docs/architecture/ai-worker.md). Overlay on compose.yml:
#   docker compose -f compose.yml -f compose.ai.yml up -d --build
# with a local model server in the same stack:
#   docker compose -f compose.yml -f compose.ai.yml --profile ollama up -d --build
#
# Add to .env (generate both with: openssl rand -hex 32):
#   FUDISLTE_AI_SHARED_SECRET=...        signs every API <-> worker request
#   FUDISLTE_AI_POSTGRES_PASSWORD=...    the worker's own vector database
# and, to enable features: FUDISLTE_AI_LLM_KIND=ollama, FUDISLTE_AI_LLM_MODEL,
# FUDISLTE_AI_EMBED_MODEL (see the guide). Without them the worker runs with every
# capability off, and FUDISLTE works exactly as without this overlay.
#
# Isolation: the worker publishes no port and sits on internal networks only. `ai` joins
# it to the API; `ai-backend` joins it to its database and the optional Ollama. Neither
# network has a route to the internet, so prompts, documents and audio stay on this host.
# The API does not depend on the worker: if it is down, AI features answer
# "capability disabled" and everything else keeps working.
# Rotated container logs, as in compose.yml (anchors do not cross files).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  api:
    environment:
      FUDISLTE_AI_URL: http://ai:8090
      FUDISLTE_AI_SHARED_SECRET: ${FUDISLTE_AI_SHARED_SECRET:?set FUDISLTE_AI_SHARED_SECRET in .env}
    networks:
      ai: {}

  ai:
    build:
      context: ../..
      dockerfile: services/ai/Dockerfile
      args:
        WITH_WHISPER: ${FUDISLTE_AI_WITH_WHISPER:-false}
    image: fudislte/ai:${FUDISLTE_VERSION:-0.1.1}
    restart: unless-stopped
    logging: *logging
    # Models can exhaust memory; the kernel then stops this before the databases.
    oom_score_adj: 500
    depends_on:
      ai-postgres:
        condition: service_healthy
    environment:
      FUDISLTE_AI_SHARED_SECRET: ${FUDISLTE_AI_SHARED_SECRET:?set FUDISLTE_AI_SHARED_SECRET in .env}
      FUDISLTE_AI_HTTP_ADDR: ":8090"
      # ollama | openai (any OpenAI-compatible server, e.g. vLLM) | none
      FUDISLTE_AI_LLM_KIND: ${FUDISLTE_AI_LLM_KIND:-none}
      FUDISLTE_AI_LLM_URL: ${FUDISLTE_AI_LLM_URL:-http://ollama:11434}
      FUDISLTE_AI_LLM_MODEL: ${FUDISLTE_AI_LLM_MODEL:-}
      FUDISLTE_AI_LLM_API_KEY: ${FUDISLTE_AI_LLM_API_KEY:-}
      # A model server outside this host receives workspace content; the worker refuses
      # such a URL unless this is true (and then requires https).
      FUDISLTE_AI_ALLOW_EXTERNAL_LLM: ${FUDISLTE_AI_ALLOW_EXTERNAL_LLM:-false}
      FUDISLTE_AI_EMBED_MODEL: ${FUDISLTE_AI_EMBED_MODEL:-}
      FUDISLTE_AI_EMBED_DIM: ${FUDISLTE_AI_EMBED_DIM:-768}
      # Empty: embeddings come from FUDISLTE_AI_LLM_URL (Ollama serves both; vLLM needs two).
      FUDISLTE_AI_EMBED_URL: ${FUDISLTE_AI_EMBED_URL:-}
      FUDISLTE_AI_DATABASE_URL: postgres://fudislte_ai:${FUDISLTE_AI_POSTGRES_PASSWORD:?set FUDISLTE_AI_POSTGRES_PASSWORD in .env}@ai-postgres:5432/fudislte_ai?sslmode=disable
      # Empty disables transcription. Needs an image built with FUDISLTE_AI_WITH_WHISPER=true
      # and the model files in the ai-models volume (no internet access here).
      FUDISLTE_AI_WHISPER_MODEL: ${FUDISLTE_AI_WHISPER_MODEL:-}
      FUDISLTE_AI_WHISPER_DEVICE: ${FUDISLTE_AI_WHISPER_DEVICE:-cpu}
      HF_HUB_OFFLINE: "1"
      # Agent tools call back to the API on its internal address (never through Caddy).
      FUDISLTE_AI_API_URL: http://api:8080
    volumes:
      - ai-models:/models
    tmpfs:
      # Uploaded audio is spooled here during a request and never reaches a disk.
      - /tmp:size=512m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-m", "fudislte_ai", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [ai, ai-backend]

  # The worker's own PostgreSQL with pgvector: derived data (chunks and embeddings), kept
  # apart from FUDISLTE's database. It can be rebuilt by re-indexing from the API.
  ai-postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    logging: *logging
    shm_size: 256m
    environment:
      POSTGRES_DB: fudislte_ai
      POSTGRES_USER: fudislte_ai
      POSTGRES_PASSWORD: ${FUDISLTE_AI_POSTGRES_PASSWORD:?set FUDISLTE_AI_POSTGRES_PASSWORD in .env}
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fudislte_ai -d fudislte_ai"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [ai-backend]

  # Optional local model server (profile "ollama"). Models are pulled once into the
  # ollama-data volume as described in the guide; this container has no internet access.
  # For an NVIDIA GPU add:
  #   deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }
  ollama:
    image: ollama/ollama:0.40.4
    profiles: [ollama]
    restart: unless-stopped
    logging: *logging
    # A model too large for the host is stopped first, not PostgreSQL.
    oom_score_adj: 500
    volumes:
      - ollama-data:/root/.ollama
    security_opt: ["no-new-privileges:true"]
    networks: [ai-backend]

networks:
  # API <-> AI worker. Internal: no internet route, nothing published.
  ai:
    internal: true
  # AI worker <-> its database and the optional Ollama. Internal as well.
  ai-backend:
    internal: true

volumes:
  ai-postgres-data:
  # Whisper models (read by the worker; populate as described in the guide).
  ai-models:
  ollama-data:
