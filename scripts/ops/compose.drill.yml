# Overlay for restore drills (scripts/ops/restore-drill.sh, scripts/ops/drill-fixture.sh).
# Applied on top of infrastructure/docker/compose.yml, it turns the production stack into
# an isolated throwaway copy that can run beside the real deployment on the same host:
#
#   - no published host ports (web, livekit), so nothing is reachable from outside;
#   - its own edge subnet (compose.yml pins 172.28.0.0/24, which the real stack owns);
#   - the exact images the source deployment runs, never built or pulled;
#   - plain HTTP and the log mail transport, so no TLS certificate or SMTP relay is
#     needed and no email can leave the host.
#
# The drill env file (generated by the scripts, never committed) provides:
#   FUDISLTE_DOMAIN, POSTGRES_PASSWORD   required by compose.yml
#   FUDISLTE_DRILL_POSTGRES_IMAGE, FUDISLTE_DRILL_API_IMAGE, FUDISLTE_DRILL_WEB_IMAGE
#   FUDISLTE_DRILL_EDGE_SUBNET           an unused /24, e.g. 172.29.71.0/24
services:
  postgres:
    image: ${FUDISLTE_DRILL_POSTGRES_IMAGE:?set FUDISLTE_DRILL_POSTGRES_IMAGE}
    pull_policy: never

  api:
    image: ${FUDISLTE_DRILL_API_IMAGE:?set FUDISLTE_DRILL_API_IMAGE}
    build: !reset null
    pull_policy: never
    environment:
      FUDISLTE_ENV: development
      FUDISLTE_PUBLIC_URL: http://localhost:8088
      FUDISLTE_COOKIE_SECURE: "false"
      FUDISLTE_MAIL_TRANSPORT: log
      FUDISLTE_TRUSTED_PROXIES: ${FUDISLTE_DRILL_EDGE_SUBNET:?set FUDISLTE_DRILL_EDGE_SUBNET}
      # Voice and video stay off in drills.
      FUDISLTE_LIVEKIT_URL: ""

  web:
    image: ${FUDISLTE_DRILL_WEB_IMAGE:?set FUDISLTE_DRILL_WEB_IMAGE}
    build: !reset null
    pull_policy: never
    environment:
      # A port-only site address makes Caddy serve plain HTTP inside the network.
      FUDISLTE_DOMAIN: ":8088"
    ports: !reset []

  livekit:
    ports: !reset []

networks:
  edge:
    ipam:
      config: !override
        - subnet: ${FUDISLTE_DRILL_EDGE_SUBNET}
